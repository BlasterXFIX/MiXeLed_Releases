name: Publish MiXeLeD 1.0.319

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-1.0.319.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-e88c-8210-ad0d-064451c5b967/raw?se=2026-10-05T08%3A31%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=efa272dc-7c57-5273-acca-a703302c690e&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T05%3A19%3A03Z&ske=2026-10-06T05%3A19%3A03Z&sks=b&skv=2026-02-06&sig=6iWVX/YKqtD7MB1YqLbS0fPDZaDxoAQ/AEjCdRuNfXA%3D' -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/MiXeLeD-1.0.319.zip
          test -f artifact/SHA256.txt
          expected="$(awk '{print tolower($1)}' artifact/SHA256.txt)"
          actual="$(sha256sum artifact/MiXeLeD-1.0.319.zip | awk '{print $1}')"
          test "$expected" = "$actual"
          test "$actual" = "55e5d5c2cf8ed7e8b4a5f175cdfde91518c03d2fd552b0d50420fa66fb5ed473"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.319 --repo BlasterXFIX/MiXeLed_Releases >/dev/null 2>&1; then
            gh release upload v1.0.319 artifact/MiXeLeD-1.0.319.zip --repo BlasterXFIX/MiXeLed_Releases --clobber
            gh release edit v1.0.319 --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.319" --notes "Adds compact binary delta updates with automatic fallback to the full package."
          else
            gh release create v1.0.319 artifact/MiXeLeD-1.0.319.zip --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.319" --notes "Adds compact binary delta updates with automatic fallback to the full package."
          fi

      - name: Update auto-update manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'JSON'
          {
            "version": "1.0.319",
            "packageUrl": "https://github.com/BlasterXFIX/MiXeLed_Releases/releases/download/v1.0.319/MiXeLeD-1.0.319.zip",
            "sha256": "55E5D5C2CF8ED7E8B4A5F175CDFDE91518C03D2FD552B0D50420FA66FB5ED473",
            "deltaPackageUrl": "",
            "deltaSha256": "",
            "deltaFromVersion": "",
            "mandatory": false,
            "notes": [
              "MiXeLeD 1.0.319: добавлена система компактных бинарных delta-обновлений с проверкой SHA-256 и автоматическим переходом на полный пакет при любой ошибке."
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish MiXeLeD 1.0.319 manifest" || exit 0
          git push
