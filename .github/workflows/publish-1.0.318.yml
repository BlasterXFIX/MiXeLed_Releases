name: Publish MiXeLeD 1.0.318

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-1.0.318.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-fc04-81f4-b0fe-fc206c90028f/raw?se=2026-10-05T07%3A47%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=ffa05c8c-8d01-5b8c-ac2a-2990bb29f412&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T02%3A52%3A58Z&ske=2026-10-06T02%3A52%3A58Z&sks=b&skv=2026-02-06&sig=fmWKH3o%2B3ibxSbSVUEW8rZMtKSK4/AuURrJC2tFXOEo%3D' -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/MiXeLeD-1.0.318.zip
          test -f artifact/SHA256.txt
          expected="$(awk '{print tolower($1)}' artifact/SHA256.txt)"
          actual="$(sha256sum artifact/MiXeLeD-1.0.318.zip | awk '{print $1}')"
          test "$expected" = "$actual"
          test "$actual" = "f774c3d301192a65a669b870214ad828e7946c9c48d77e7db279e73ad521cc70"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.318 --repo BlasterXFIX/MiXeLed_Releases >/dev/null 2>&1; then
            gh release upload v1.0.318 artifact/MiXeLeD-1.0.318.zip --repo BlasterXFIX/MiXeLed_Releases --clobber
            gh release edit v1.0.318 --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.318" --notes "Datacolor S/N 14409 calibration fix: diagtile.ini is optional."
          else
            gh release create v1.0.318 artifact/MiXeLeD-1.0.318.zip --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.318" --notes "Datacolor S/N 14409 calibration fix: diagtile.ini is optional."
          fi

      - name: Update auto-update manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'JSON'
          {
            "version": "1.0.318",
            "packageUrl": "https://github.com/BlasterXFIX/MiXeLed_Releases/releases/download/v1.0.318/MiXeLeD-1.0.318.zip",
            "sha256": "F774C3D301192A65A669B870214AD828E7946C9C48D77E7DB279E73AD521CC70",
            "mandatory": false,
            "notes": [
              "MiXeLeD 1.0.318: для Datacolor обязательны PRxxxx.CAL, WHITESE.DAT и WHITESI.DAT. diagtile.ini больше не блокирует калибровку и используется только если присутствует."
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish MiXeLeD 1.0.318 manifest" || exit 0
          git push
