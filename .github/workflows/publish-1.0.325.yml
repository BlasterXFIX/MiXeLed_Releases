name: Publish MiXeLeD 1.0.325

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-1.0.325.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ff1c-8210-928f-2630966c40fd/raw?se=2026-10-05T11%3A50%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=7fdc34be-f89f-5d21-bef0-046ae6a02f66&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T02%3A58%3A13Z&ske=2026-10-06T02%3A58%3A13Z&sks=b&skv=2026-02-06&sig=IxT9%2B9RNPLrrKJptd0AX3paomgQZuqd/xXnNEY0Mry0%3D' -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/MiXeLeD-1.0.325.zip
          test -f artifact/MiXeLeD-1.0.324-to-1.0.325.delta.zip
          full="$(sha256sum artifact/MiXeLeD-1.0.325.zip | awk '{print $1}')"
          delta="$(sha256sum artifact/MiXeLeD-1.0.324-to-1.0.325.delta.zip | awk '{print $1}')"
          test "$full" = "5ff5cbec4fbac84de9f7efab13305ff22ca19d365a5fe64ef085ff50edc7c6f2"
          test "$delta" = "dbfd2ab2160007bf2b685fa40d3f13d152036adf10ac01ce87a07fb9be2bd16e"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.325 --repo BlasterXFIX/MiXeLed_Releases >/dev/null 2>&1; then
            gh release upload v1.0.325 artifact/MiXeLeD-1.0.325.zip artifact/MiXeLeD-1.0.324-to-1.0.325.delta.zip --repo BlasterXFIX/MiXeLed_Releases --clobber
            gh release edit v1.0.325 --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.325" --notes "Datacolor 110 calibration now remains in the dedicated persistent Host instead of being destroyed by a forced cold-start test. Closing Color Lab or MiXeLeD keeps the active calibration; Windows/Host restart still requires recalibration on this legacy UniSpef32 driver."
          else
            gh release create v1.0.325 artifact/MiXeLeD-1.0.325.zip artifact/MiXeLeD-1.0.324-to-1.0.325.delta.zip --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.325" --notes "Datacolor 110 calibration now remains in the dedicated persistent Host instead of being destroyed by a forced cold-start test. Closing Color Lab or MiXeLeD keeps the active calibration; Windows/Host restart still requires recalibration on this legacy UniSpef32 driver."
          fi

      - name: Update auto-update manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'JSON'
          {
            "version": "1.0.325",
            "packageUrl": "https://github.com/BlasterXFIX/MiXeLed_Releases/releases/download/v1.0.325/MiXeLeD-1.0.325.zip",
            "sha256": "5FF5CBEC4FBAC84DE9F7EFAB13305FF22CA19D365A5FE64EF085FF50EDC7C6F2",
            "deltaPackageUrl": "https://github.com/BlasterXFIX/MiXeLed_Releases/releases/download/v1.0.325/MiXeLeD-1.0.324-to-1.0.325.delta.zip",
            "deltaSha256": "DBFD2AB2160007BF2B685FA40D3F13D152036ADF10AC01CE87A07FB9BE2BD16E",
            "deltaFromVersion": "1.0.324",
            "mandatory": false,
            "notes": [
              "MiXeLeD 1.0.325: калибровка Datacolor 110 теперь сохраняется в постоянном Host и больше не сбрасывается нашей принудительной проверкой нового Host. Закрытие Color Lab или MiXeLeD не сбрасывает активную калибровку; после перезагрузки Windows/Host на этом старом UniSpef32 потребуется калибровка заново."
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish MiXeLeD 1.0.325 manifest" || exit 0
          git push
