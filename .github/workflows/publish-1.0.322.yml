name: Publish MiXeLeD 1.0.322

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-1.0.322.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-937c-8210-9a51-e8d86a9be6c9/raw?se=2026-10-05T10%3A53%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=c8dcbc7b-ed4b-516a-b8ff-7a38f9240a54&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T05%3A50%3A05Z&ske=2026-10-06T05%3A50%3A05Z&sks=b&skv=2026-02-06&sig=120E/t3eEZqz%2BOzFoFhQPH34TKCel78eQueKVMXRk7Y%3D' -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/MiXeLeD-1.0.322.zip
          test -f artifact/MiXeLeD-1.0.321-to-1.0.322.delta.zip
          full="$(sha256sum artifact/MiXeLeD-1.0.322.zip | awk '{print $1}')"
          delta="$(sha256sum artifact/MiXeLeD-1.0.321-to-1.0.322.delta.zip | awk '{print $1}')"
          test "$full" = "4be43f15cd6f4bfd39e8521572596e62d247f96560b7e2845e96f4ba7e01d9ad"
          test "$delta" = "8c0261edaf697ba4e67cc04d609c2289094eaef8b00c1745425b124964def719"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.322 --repo BlasterXFIX/MiXeLed_Releases >/dev/null 2>&1; then
            gh release upload v1.0.322 artifact/MiXeLeD-1.0.322.zip artifact/MiXeLeD-1.0.321-to-1.0.322.delta.zip --repo BlasterXFIX/MiXeLed_Releases --clobber
            gh release edit v1.0.322 --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.322" --notes "Datacolor calibration persistence fix: finalize through spClose and verify restoration in a fresh Host before marking calibration as saved."
          else
            gh release create v1.0.322 artifact/MiXeLeD-1.0.322.zip artifact/MiXeLeD-1.0.321-to-1.0.322.delta.zip --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.322" --notes "Datacolor calibration persistence fix: finalize through spClose and verify restoration in a fresh Host before marking calibration as saved."
          fi

      - name: Update auto-update manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'JSON'
          {
            "version": "1.0.322",
            "packageUrl": "https://github.com/BlasterXFIX/MiXeLed_Releases/releases/download/v1.0.322/MiXeLeD-1.0.322.zip",
            "sha256": "4BE43F15CD6F4BFD39E8521572596E62D247F96560B7E2845E96F4BA7E01D9AD",
            "deltaPackageUrl": "https://github.com/BlasterXFIX/MiXeLed_Releases/releases/download/v1.0.322/MiXeLeD-1.0.321-to-1.0.322.delta.zip",
            "deltaSha256": "8C0261EDAF697BA4E67CC04D609C2289094EAEF8B00C1745425B124964DEF719",
            "deltaFromVersion": "1.0.321",
            "mandatory": false,
            "notes": [
              "MiXeLeD 1.0.322: исправлено сохранение калибровки Datacolor после перезапуска Host/Windows; состояние считается сохранённым только после успешной проверки в новом Host."
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish MiXeLeD 1.0.322 manifest" || exit 0
          git push
