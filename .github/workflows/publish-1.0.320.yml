name: Publish MiXeLeD 1.0.320

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-1.0.320.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6454-8246-99ce-7479b0a7e17f/raw?se=2026-10-05T08%3A47%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=4e142e5e-1ec9-5633-8647-5f017e343851&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T18%3A05%3A34Z&ske=2026-10-05T18%3A05%3A34Z&sks=b&skv=2026-02-06&sig=qt6HyYdJekYfzkcPtaz/zMAxV0T/yrPGaVTyBRPn2tc%3D' -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/MiXeLeD-1.0.320.zip
          test -f artifact/MiXeLeD-1.0.319-to-1.0.320.delta.zip
          test -f artifact/SHA256.txt
          test -f artifact/DELTA-SHA256.txt
          full="$(sha256sum artifact/MiXeLeD-1.0.320.zip | awk '{print $1}')"
          delta="$(sha256sum artifact/MiXeLeD-1.0.319-to-1.0.320.delta.zip | awk '{print $1}')"
          test "$full" = "9bb14deb45d57f664a6f5be7e01ea75886d795ba4787b71df07ef62aa6ca0f5a"
          test "$delta" = "a0586394d69669613a79fa09cd0e0626941fec14ba4bd10c6198f5c02515dfd7"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.320 --repo BlasterXFIX/MiXeLed_Releases >/dev/null 2>&1; then
            gh release upload v1.0.320 artifact/MiXeLeD-1.0.320.zip artifact/MiXeLeD-1.0.319-to-1.0.320.delta.zip --repo BlasterXFIX/MiXeLed_Releases --clobber
            gh release edit v1.0.320 --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.320" --notes "QC safety and clarity improvements. Compact 1.0.319 -> 1.0.320 delta update included."
          else
            gh release create v1.0.320 artifact/MiXeLeD-1.0.320.zip artifact/MiXeLeD-1.0.319-to-1.0.320.delta.zip --repo BlasterXFIX/MiXeLed_Releases --title "MiXeLeD 1.0.320" --notes "QC safety and clarity improvements. Compact 1.0.319 -> 1.0.320 delta update included."
          fi

      - name: Update auto-update manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'JSON'
          {
            "version": "1.0.320",
            "packageUrl": "https://github.com/BlasterXFIX/MiXeLed_Releases/releases/download/v1.0.320/MiXeLeD-1.0.320.zip",
            "sha256": "9BB14DEB45D57F664A6F5BE7E01EA75886D795BA4787B71DF07EF62AA6CA0F5A",
            "deltaPackageUrl": "https://github.com/BlasterXFIX/MiXeLed_Releases/releases/download/v1.0.320/MiXeLeD-1.0.319-to-1.0.320.delta.zip",
            "deltaSha256": "A0586394D69669613A79FA09CD0E0626941FEC14BA4BD10C6198F5C02515DFD7",
            "deltaFromVersion": "1.0.319",
            "mandatory": false,
            "notes": [
              "MiXeLeD 1.0.320: подтверждение перед заменой эталона; количество краски в очереди КК; крупная строка текущей проверяемой краски; выделение активной строки КК. Для 1.0.319 доступно компактное delta-обновление."
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish MiXeLeD 1.0.320 manifest" || exit 0
          git push
